name: PAC-MAN Ghostly Adventures x86

on:
  workflow_dispatch:
  push:
    branches: [pacman-ghostly-adventures]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          submodules: recursive

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang,spirv-tools

      - name: Configure build for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (x86)
        run: cmake --preset ninja-x86

      - name: Build (x86)
        run: cmake --build --preset ninja-x86-release --target pacmanghostlyadventures --verbose

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: renodx-pacmanghostlyadventures
          path: build32/**/renodx-pacmanghostlyadventures.addon32
          if-no-files-found: error
